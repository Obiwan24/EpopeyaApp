spring.datasource.url=jdbc:postgresql://ep-plain-frog-zahgm1q6-pooler.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
dni.encryption.key=${DNI_ENCRYPTION_KEY}

# ============================================================================
# NUEVO: sin estas propiedades, JwtUtil, CorsConfig y MailConfig no podian
# arrancar (JwtUtil directamente lanzaba una excepcion al no encontrar
# "jwt.secret"). Configuralas como variables de entorno en tu proveedor
# (Render/Railway/etc.), igual que ya haces con DB_USERNAME/DB_PASSWORD.
# ============================================================================

# Clave para firmar los JWT. DEBE tener al menos 32 caracteres. Genera una
# aleatoria propia para produccion, por ejemplo con: openssl rand -base64 48
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-aleatoria-de-al-menos-32-caracteres}
# Duracion del token en milisegundos (24h por defecto)
jwt.expiration-ms=86400000

# Origenes permitidos para llamar a la API desde fuera del propio dominio.
# "*" vale para desarrollo; en produccion pon tu dominio real, ej:
# app.cors.allowed-origins=https://epopeyaapp.onrender.com
app.cors.allowed-origins=*

# Credenciales SMTP para el correo de "recuperar contraseña".
# Si usas Gmail, spring.mail.password debe ser una "contraseña de aplicacion",
# no la contraseña normal de la cuenta.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}