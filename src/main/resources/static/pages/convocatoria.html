<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convocatorias - EpopeyApp</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Fuentes estilo clásico -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="convocatoria.css">
</head>
<body>

<!-- CABECERA DE NAVEGACIÓN -->
<header class="greek-header d-flex justify-content-between align-items-center">
    <a href="principal.html" class="header-icon-btn" title="Volver al Menú Principal">
        <i class="bi bi-arrow-left fs-4"></i>
    </a>
    <div class="text-center">
        <img src="../assets/img/logo.jpeg" alt="Logo Equipo" class="header-logo">
    </div>
    <a href="perfil.html" class="header-icon-btn" title="Mi Perfil">
        <i class="bi bi-person-circle fs-4"></i>
    </a>
</header>

<main class="convocatoria-container">

    <!-- BOTÓN AÑADIR JORNADA (Visible para CAPITÁN) -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-white font-cinzel m-0" style="font-family:'Cinzel';">Convocatorias</h3>
        <button id="btnNuevaJornada" class="btn btn-greek captain-only d-none" data-bs-toggle="modal" data-bs-target="#modalNuevaJornada">
            <i class="bi bi-plus-circle me-1"></i> Añadir Jornada
        </button>
    </div>

    <!-- LISTA DE JORNADAS -->
    <div id="listaJornadas">

    </div>
</main>

<!-- MODAL: AÑADIR JORNADA -->
<div class="modal fade" id="modalNuevaJornada" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Añadir Nueva Jornada</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="formNuevaJornada">
                    <!-- Enfrentamiento -->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label font-cinzel">Número Jornada</label>
                            <input type="number" class="form-control" id="numeroJornada" min="1" required>
                        </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label font-cinzel">Equipo Local</label>
                            <input type="text" class="form-control" id="equipoLocal" value="EPOPEYA" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label font-cinzel">Equipo Visitante</label>
                            <input type="text" class="form-control" id="equipoRival" placeholder="Ej: NUDION" required>
                        </div>
                    </div>

                    <!-- Configuración de Partidos -->
                    <div id="partidosForm">
                        <!-- Partido 1 -->
                        <div class="p-3 border rounded mb-3 bg-light">
                            <h6 class="fw-bold text-dark"><i class="bi bi-trophy"></i>Partido 1</h6>
                            <div class="row g-2">
                                <div class="col-md-4"><label class="small text-muted">Fecha</label><input type="date" id="p1-fecha" class="form-control-sm" required></div>
                                <div class="col-md-4"><label class="small text-muted">Hora</label><input type="time" id="p1-hora" class="form-control form-control-sm" required></div>
                                <div class="col-md-4"><label class="small text-muted">Lugar</label><input type="text" id="p1-lugar" class="form-control form-control-sm" placeholder="Lugar" required></div>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="small text-muted fw-bold">Jugador 1 Convocado</label>
                                <select id="p1-j1" class="form-select form-select-sm select-jugador-modal">
                                    <option value="">-- Seleccionar Jugador --</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="small text-muted fw-bold">Jugador 2 Convocado</label>
                                <select id="p1-j2" class="form-select form-select-sm select-jugador-modal">
                                    <option value="">-- Seleccionar Jugador --</option>
                                </select>
                            </div>
                        </div>
                    </div>
                        <!-- Partido 2 -->
                        <div class="p-3 border rounded mb-3 bg-light">
                            <h6 class="fw-bold text-dark"><i class="bi bi-trophy"></i> Partido 2</h6>
                            <div class="row g-2 mb-2">
                                <div class="col-md-4"><label class="small text-muted">Fecha</label><input type="date" id="p2-fecha" class="form-control form-control-sm" required></div>
                                <div class="col-md-4"><label class="small text-muted">Hora</label><input type="time" id="p2-hora" class="form-control form-control-sm" required></div>
                                <div class="col-md-4"><label class="small text-muted">Lugar</label><input type="text" id="p2-lugar" class="form-control form-control-sm" placeholder="Lugar" required></div>
                            </div>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="small text-muted fw-bold">Jugador 1 Convocado</label>
                                    <select id="p2-j1" class="form-select form-select-sm select-jugador-modal">
                                        <option value="">-- Seleccionar Jugador --</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="small text-muted fw-bold">Jugador 2 Convocado</label>
                                    <select id="p2-j2" class="form-select form-select-sm select-jugador-modal">
                                        <option value="">-- Seleccionar Jugador --</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Partido 3 -->
                        <div class="p-3 border rounded mb-3 bg-light">
                            <h6 class="fw-bold text-dark"><i class="bi bi-trophy"></i> Partido 3</h6>
                            <div class="row g-2 mb-2">
                                <div class="col-md-4"><label class="small text-muted">Fecha</label><input type="date" id="p3-fecha" class="form-control form-control-sm" required></div>
                                <div class="col-md-4"><label class="small text-muted">Hora</label><input type="time" id="p3-hora" class="form-control form-control-sm" required></div>
                                <div class="col-md-4"><label class="small text-muted">Lugar</label><input type="text" id="p3-lugar" class="form-control form-control-sm" placeholder="Lugar" required></div>
                            </div>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="small text-muted fw-bold">Jugador 1 Convocado</label>
                                    <select id="p3-j1" class="form-select form-select-sm select-jugador-modal">
                                        <option value="">-- Seleccionar Jugador --</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="small text-muted fw-bold">Jugador 2 Convocado</label>
                                    <select id="p3-j2" class="form-select form-select-sm select-jugador-modal">
                                        <option value="">-- Seleccionar Jugador --</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-greek">Guardar Jornada</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: MODIFICAR/DESCONVOCAR JUGADOR (Capitán) -->
<div class="modal fade" id="modalModificarJugador" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modificar Convocatoria</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <p class="text-dark">Jugador actual: <strong id="nombreJugadorModificar">--</strong></p>
                <input type="hidden" id="modalPartidoId">
                <input type="hidden" id="modalSlot">

                <div class="d-grid gap-2">
                    <label class="form-label text-dark fw-bold" >Sustituir por:</label>
                    <select id="selectSustituto" class="form-select">
                        <option value="">-- Seleccionar Jugador --</option>
                    </select>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-primary" onclick="confirmarSustituto()">Guardar cambios</button>
                    <button type="button" class="btn btn-danger" onclick="desconvocarJugador()">Desconvocar jugador</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS Bootstrap + Lógica -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/convocatoria.js"></script>
</body>
</html>
