<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Epopeya App</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap (Bootstrap Icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Fuentes estilo clásico griego -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS Personalizado para la pantalla principal -->
    <link rel="stylesheet" href="principal.css">
</head>
<body>

<!-- CABECERA PRINCIPAL -->
<header class="greek-header d-flex justify-content-between align-items-center">
    <!-- Izquierda: Icono Salir (Cierra sesión) -->
    <button id="logoutBtn" class="header-icon-btn" title="Cerrar Sesión">
        <i class="bi bi-box-arrow-left fs-4"></i>
    </button>

    <!-- Centro: Logo del equipo -->
    <div class="text-center">
        <img src="../assets/img/logo.jpeg" alt="Logo Equipo" class="header-logo">
    </div>

    <!-- Derecha: Icono de Usuario (Perfil) -->
    <a href="perfil.html" class="header-icon-btn" title="Mi Perfil">
        <i class="bi bi-person-circle fs-4"></i>
    </a>
</header>

<!-- CONTENIDO PRINCIPAL: BOTONES CUADRADOS (2 COLUMNAS) -->
<main class="main-container">

    <!-- Fila 1: Jugadores y Clasificación -->
    <div class="row g-3 mb-3">
        <div class="col-6">
            <a href="jugadores.html" class="square-btn">
                <i class="bi bi-people-fill"></i>
                <span>JUGADORES</span>
            </a>
        </div>
        <div class="col-6">
            <a href="" class="square-btn">
                <i class="bi bi-trophy-fill"></i>
                <span>CLASIFICACIÓN</span>
            </a>
        </div>
    </div>

    <!-- Fila 2: Jornadas y Votos de fecha -->
    <div class="row g-3 mb-3">
        <div class="col-6">
            <a href="jornadas.html" class="square-btn">
                <i class="bi bi-calendar-event-fill"></i>
                <span>JORNADAS</span>
            </a>
        </div>
        <div class="col-6">
            <a href="elecciones.html" class="square-btn">
                <i class="bi bi-ui-checks"></i>
                <span>VOTOS FECHA</span>
            </a>
        </div>
    </div>

    <!-- Fila 3: Disponibilidad y Convocatoria -->
    <div class="row g-3 mb-3">
        <div class="col-6">
            <a href="disponibilidad.html" class="square-btn">
                <i class="bi bi-check-circle-fill"></i>
                <span>DISPONIBILIDAD</span>
            </a>
        </div>
        <div class="col-6">
            <a href="convocatoria.html" class="square-btn">
                <i class="bi bi-clipboard-check-fill"></i>
                <span>CONVOCATORIA</span>
            </a>
        </div>
    </div>

    <!-- Fila 4: Estadísticas (Centrado o ocupando la fila) -->
    <div class="row g-3">
        <div class="col-6 mx-auto">
            <a href="estadisticas.html" class="square-btn">
                <i class="bi bi-bar-chart-line-fill"></i>
                <span>ESTADÍSTICAS</span>
            </a>
        </div>
    </div>
</main>
<!-- Scripts de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script global de la API (para comprobar la sesión) -->
<script src="/js/api.js"></script>

<!-- Lógica mínima de la pantalla principal -->
<script>
    // Exigir que el usuario esté logueado para ver esta pantalla
    exigirSesion();

    document.addEventListener("DOMContentLoaded", () => {
        // Obtener el usuario guardado en sesión
        const usuario = getUsuarioActual();

        // Muestra el nombre del usuario en la bienvenida
        const elSaludo = document.getElementById("saludo-usuario");
        if (elSaludo && usuario) {
            elSaludo.textContent = `Bienvenido, ${usuario.nombre}`;
        }

        // Mostrar u ocultar elementos según si es CAPITÁN o JUGADOR
        if (usuario && usuario.rol === "CAPITAN") {
            const elementosCapitan = document.querySelectorAll(".solo-capitan");
            elementosCapitan.forEach(el => el.classList.remove("oculto"));
        }
    });

    // Configuración de la URL de la liga oficial
    const URL_LIGA_OFICIAL = "https://www.google.com"; // <- Cambiar por la URL real cuando empiece la liga

    function abrirLigaOficial(event) {
        event.preventDefault();

        if (!URL_LIGA_OFICIAL || URL_LIGA_OFICIAL === "https://www.google.com") {
            const confirmar = confirm("La URL oficial de la liga aún no está configurada. ¿Deseas abrir el enlace de prueba?");
            if (!confirmar) return;
        }

        window.open(URL_LIGA_OFICIAL, '_blank', 'noopener,noreferrer');
    }
</script>
</body>
</html>
